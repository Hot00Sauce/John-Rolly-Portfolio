<div style="margin:0;background:#111827;color:#e5e7eb;font-family:Arial,sans-serif;padding:32px 16px;">
  <div style="max-width:640px;margin:0 auto;background:#1f2937;border:1px solid #1abc9c;border-radius:16px;overflow:hidden;">
    <div style="background:linear-gradient(135deg,#1a4d4f,#1abc9c,#16a085);padding:24px 28px;">
      <h1 style="margin:0;color:#fff;font-size:24px;">New portfolio message</h1>
      <p style="margin:8px 0 0;color:#eafffa;">Someone would like to connect with you.</p>
    </div>
    <div style="padding:28px;">
      <p style="margin:0 0 8px;color:#9ca3af;font-size:12px;text-transform:uppercase;letter-spacing:1px;">Subject</p>
      <p style="margin:0 0 24px;color:#fff;font-size:20px;">{{subject}}</p>
      <table role="presentation" style="width:100%;border-collapse:collapse;margin-bottom:24px;">
        <tr>
          <td style="padding:10px 0;color:#9ca3af;width:110px;">Name</td>
          <td style="padding:10px 0;color:#fff;">{{name}}</td>
        </tr>
        <tr>
          <td style="padding:10px 0;color:#9ca3af;">Email</td>
          <td style="padding:10px 0;"><a href="mailto:{{email}}" style="color:#1abc9c;">{{email}}</a></td>
        </tr>
        <tr>
          <td style="padding:10px 0;color:#9ca3af;">Company</td>
          <td style="padding:10px 0;color:#fff;">{{company}}</td>
        </tr>
      </table>
      <div style="border-top:1px solid #374151;padding-top:20px;">
        <p style="margin:0 0 8px;color:#9ca3af;font-size:12px;text-transform:uppercase;letter-spacing:1px;">Message</p>
        <p style="margin:0;color:#f3f4f6;line-height:1.7;white-space:pre-line;">{{message}}</p>
      </div>
    </div>
    <div style="padding:16px 28px;background:#111827;color:#9ca3af;font-size:12px;">
      Sent from John Rolly Cedillo's portfolio contact form.
    </div>
  </div>
</div>
